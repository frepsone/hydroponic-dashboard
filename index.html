<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HydroponicOne Cloud</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; background: #0e1a12; color: #eee; padding: 20px; max-width: 800px; margin: auto; }
    h1, h2 { color: #8fd694; }
    
    /* Stile per i box in tempo reale */
    .dashboard-grid { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .card { background: #16241a; border-radius: 10px; padding: 15px; flex: 1; min-width: 150px; text-align: center; }
    .label { color: #9ab; font-size: 0.85em; margin-bottom: 5px; }
    .value { font-size: 1.8em; font-weight: bold; color: #fff; }
    
    /* Stile per lo status */
    .status-box { background: #16241a; padding: 10px 15px; border-radius: 8px; display: inline-block; margin-bottom: 20px; font-weight: bold;}
    .online { color: #8fd694; }
    .offline { color: #e07a5f; }

    canvas { background: #16241a; border-radius: 10px; padding: 10px; margin-bottom: 20px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #2a3a2e; }
    th { background-color: #16241a; color: #8fd694; }
  </style>
</head>
<body>
  <h1>HydroponicOne - Dashboard</h1>
  
  <div class="status-box">
    Stato Centralina: <span id="status-indicator" class="offline">IN ATTESA DATI... ⚪</span>
    <div style="font-size: 0.7em; color: #678; font-weight: normal; margin-top: 4px;" id="last-update">Ultimo contatto: --</div>
  </div>

  <div class="dashboard-grid">
    <div class="card"><div class="label">Acqua (DS18B20)</div><div class="value" id="val-acqua">-- °C</div></div>
    <div class="card"><div class="label">Aria (DHT22)</div><div class="value" id="val-aria">-- °C</div></div>
    <div class="card"><div class="label">Umidità Aria</div><div class="value" id="val-umidita">-- %</div></div>
  </div>
  
  <h2>Andamento Temperature</h2>
  <canvas id="grafico"></canvas>
  
  <h2>Storico Dettagliato (Ultime 100)</h2>
  <table id="tabella">
    <tr><th>Data e Ora</th><th>T. Acqua</th><th>T. Aria</th><th>Umidità</th></tr>
  </table>

  <!-- Modulo Firebase V9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, onValue, limitToLast, query } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    // INSERISCI QUI I TUOI DUE CODICI FIREBASE (Mantieni le virgolette!)
    const firebaseConfig = {
      apiKey: "AIzaSyDTNX50TvZb-8Q7jcg8KxDyymJ8v0TY1_0",
      databaseURL: "https://hydrostradellazzo-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // --- 1. GESTIONE TEMPO REALE E ONLINE/OFFLINE ---
    let offlineTimer;
    const statusIndicator = document.getElementById('status-indicator');
    
    onValue(ref(db, 'stato'), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      // Aggiorna le carte in tempo reale (formattate con 1 decimale)
      document.getElementById('val-acqua').innerText = parseFloat(data.t_acqua).toFixed(1) + " °C";
      document.getElementById('val-aria').innerText = parseFloat(data.t_aria).toFixed(1) + " °C";
      document.getElementById('val-umidita').innerText = parseFloat(data.u_aria).toFixed(1) + " %";
      document.getElementById('last-update').innerText = "Ultimo contatto: " + data.ultimo_aggiornamento;

      // Imposta su ONLINE
      statusIndicator.innerText = "ONLINE 🟢";
      statusIndicator.className = "online";

      // Resetta il timer: se non arrivano nuovi dati per 15 secondi, va OFFLINE
      clearTimeout(offlineTimer);
      offlineTimer = setTimeout(() => {
        statusIndicator.innerText = "OFFLINE 🔴 (Scollegata o senza Wi-Fi)";
        statusIndicator.className = "offline";
      }, 15000); 
    });

    // --- 2. GESTIONE STORICO E GRAFICO ---
    const storicoRef = query(ref(db, 'storico'), limitToLast(100));
    let chart = new Chart(document.getElementById('grafico'), {
      type: 'line',
      data: { labels: [], datasets: [
        { label: 'Acqua (°C)', borderColor: '#36a2eb', data: [] },
        { label: 'Aria (°C)', borderColor: '#ff6384', data: [] }
      ]},
      options: { animation: false }
    });

    onValue(storicoRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const table = document.getElementById('tabella');
      table.innerHTML = "<tr><th>Data e Ora</th><th>T. Acqua</th><th>T. Aria</th><th>Umidità</th></tr>";
      
      let labels = [], acqua = [], aria = [];

      Object.values(data).forEach(row => {
        // Usa solo l'orario per l'asse X del grafico (es. 15:45)
        labels.push(row.ora.substring(11, 16)); 
        acqua.push(row.t_acqua);
        aria.push(row.t_aria);
        
        let newRow = table.insertRow(1); 
        newRow.innerHTML = `<td>${row.ora}</td><td>${parseFloat(row.t_acqua).toFixed(1)}°C</td><td>${parseFloat(row.t_aria).toFixed(1)}°C</td><td>${parseFloat(row.u_aria).toFixed(1)}%</td>`;
      });

      chart.data.labels = labels;
      chart.data.datasets[0].data = acqua;
      chart.data.datasets[1].data = aria;
      chart.update();
    });
  </script>
</body>
</html>
