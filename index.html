<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Hydroponic iOS</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; --text-sec: #8E8E93; --green: #30D158; --blue: #0A84FF; --orange: #FF9F0A; --red: #FF453A; --pill: #2C2C2E; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 50px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 20px; letter-spacing: 0.5px; }
    
    .status-box { background: var(--card); padding: 16px; border-radius: 16px; margin-bottom: 24px; font-weight: 600; font-size: 15px; }
    .status-box span { font-weight: 700; }
    .online { color: var(--green); }
    .offline { color: var(--red); }
    .update-time { font-size: 13px; color: var(--text-sec); font-weight: 400; margin-top: 6px; }

    .grid { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
    .card-mini { background: var(--card); border-radius: 16px; padding: 16px; flex: 1; min-width: 130px; }
    .card-mini .label { color: var(--text-sec); font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }
    .card-mini .value { font-size: 24px; font-weight: 700; }
    .v-acqua { color: var(--blue); } .v-aria { color: var(--orange); } .v-umidita { color: var(--green); } .v-ec { color: var(--text); }

    .filter-row { display: flex; gap: 12px; margin-bottom: 15px; }
    .ios-select { background: var(--pill); color: var(--text); border: none; padding: 12px 16px; border-radius: 12px; font-size: 16px; font-weight: 600; outline: none; -webkit-appearance: none; appearance: none; flex: 1; text-align: center; cursor: pointer; }
    
    .calendar-strip { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; margin-bottom: 20px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .calendar-strip::-webkit-scrollbar { display: none; }
    .day-pill { background: var(--pill); color: var(--text-sec); padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
    .day-pill.active { background: var(--text); color: var(--bg); }
    .no-data { color: var(--text-sec); font-size: 15px; padding: 10px; text-align: center; width: 100%; }

    .day-view { background: var(--card); border-radius: 16px; padding: 20px; display: none; }
    .day-title { font-size: 20px; font-weight: 700; margin-bottom: 15px; }
    .averages-grid { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #38383A; padding-bottom: 15px; }
    .avg-item { text-align: center; }
    .avg-val { font-size: 18px; font-weight: 700; }
    .avg-lbl { font-size: 12px; color: var(--text-sec); text-transform: uppercase; margin-top: 4px; }
    
    canvas { width: 100%; max-height: 280px; margin-bottom: 20px; }
    
    .action-row { display: flex; gap: 10px; }
    .btn { flex: 1; background: #2C2C2E; color: var(--blue); border: none; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; }
    .btn:active { background: #3A3A3C; }
    .btn.acid { color: var(--orange); }
  </style>
</head>
<body>
  <h1>Riepilogo</h1>
  
  <div class="status-box">
    Stato Sistema: <span id="status-indicator" class="offline">IN ATTESA...</span>
    <div class="update-time" id="last-update">Ultimo contatto: --</div>
  </div>

  <div class="grid">
    <div class="card-mini"><div class="label">Acqua</div><div class="value v-acqua" id="val-acqua">--°</div></div>
    <div class="card-mini"><div class="label">Aria</div><div class="value v-aria" id="val-aria">--°</div></div>
    <div class="card-mini"><div class="label">Umidità</div><div class="value v-umidita" id="val-umidita">--%</div></div>
    <div class="card-mini"><div class="label">EC</div><div class="value v-ec" id="val-ec">--</div></div>
  </div>

  <div class="filter-row">
    <select id="month-select" class="ios-select"></select>
    <select id="year-select" class="ios-select"></select>
  </div>

  <div class="calendar-strip" id="calendar-strip"></div>

  <div class="day-view" id="day-view">
    <div class="day-title" id="day-title">Seleziona un giorno</div>
    
    <div class="averages-grid">
      <div class="avg-item"><div class="avg-val v-acqua" id="avg-acqua">--°</div><div class="avg-lbl">Media Acqua</div></div>
      <div class="avg-item"><div class="avg-val v-aria" id="avg-aria">--°</div><div class="avg-lbl">Media Aria</div></div>
      <div class="avg-item"><div class="avg-val v-umidita" id="avg-umidita">--%</div><div class="avg-lbl">Media Umidità</div></div>
    </div>

    <canvas id="main-chart"></canvas>

    <div class="action-row">
      <button class="btn" id="btn-nutrienti">🌿 + Nutrienti</button>
      <button class="btn acid" id="btn-acido">💧 + Acido</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, onValue, query, push, orderByChild, startAt, endAt } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    // INSERISCI QUI I TUOI DATI FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDTNX50TvZb-8Q7jcg8KxDyymJ8v0TY1_0",
      databaseURL: "https://hydrostradellazzo-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    let mainChart = null;
    let storeGiorni = {}; 
    let activeDateStr = "";
    let unsubscribeStorico = null; 

    // --- TEMPO REALE ---
    let offlineTimer;
    onValue(ref(db, 'stato'), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      document.getElementById('val-acqua').innerText = parseFloat(data.t_acqua).toFixed(1) + "°";
      document.getElementById('val-aria').innerText = parseFloat(data.t_aria).toFixed(1) + "°";
      document.getElementById('val-umidita').innerText = parseFloat(data.u_aria).toFixed(0) + "%";
      
      // Lettura del nuovo valore EC formattato a 2 decimali
      document.getElementById('val-ec').innerText = (data.ec !== undefined ? parseFloat(data.ec).toFixed(2) : "--") + " mS";
      
      document.getElementById('last-update').innerText = "Aggiornato: " + data.ultimo_aggiornamento;

      const indic = document.getElementById('status-indicator');
      indic.innerText = "ONLINE"; indic.className = "online";
      clearTimeout(offlineTimer);
      offlineTimer = setTimeout(() => { indic.innerText = "OFFLINE"; indic.className = "offline"; }, 15000); 
    });

    // --- FILTRI MESE E ANNO ---
    const monthSelect = document.getElementById('month-select');
    const yearSelect = document.getElementById('year-select');

    function initFiltri() {
      const now = new Date();
      let currYear = now.getFullYear();
      let currMonth = String(now.getMonth() + 1).padStart(2, '0');

      for(let y = 2026; y <= currYear; y++) {
        let opt = document.createElement('option');
        opt.value = y; opt.text = y;
        yearSelect.appendChild(opt);
      }
      yearSelect.value = currYear;

      aggiornaMesiDisponibili();
      monthSelect.value = currMonth;

      yearSelect.addEventListener('change', () => { aggiornaMesiDisponibili(); caricaDatiMese(); });
      monthSelect.addEventListener('change', () => { caricaDatiMese(); });
      
      caricaDatiMese();
    }

    function aggiornaMesiDisponibili() {
      const selectedYear = parseInt(yearSelect.value);
      const mesi = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
      const currentVal = monthSelect.value;
      monthSelect.innerHTML = "";
      
      for(let i = 0; i < 12; i++) {
        if(selectedYear === 2026 && i < 7) continue; 
        
        let mNum = String(i + 1).padStart(2, '0');
        let opt = document.createElement('option');
        opt.value = mNum; opt.text = mesi[i];
        monthSelect.appendChild(opt);
      }
      
      if([...monthSelect.options].some(o => o.value === currentVal)) {
        monthSelect.value = currentVal;
      } else {
        monthSelect.selectedIndex = monthSelect.options.length - 1;
      }
    }

    // --- CARICAMENTO STORICO ---
    function caricaDatiMese() {
      if(unsubscribeStorico) unsubscribeStorico(); 

      const anno = yearSelect.value;
      const mese = monthSelect.value;
      const prefissoRicerca = `${anno}-${mese}`;

      const queryMese = query(ref(db, 'storico'), orderByChild('ora'), startAt(prefissoRicerca), endAt(prefissoRicerca + '\uf8ff'));

      unsubscribeStorico = onValue(queryMese, (snapshot) => {
        const data = snapshot.val();
        storeGiorni = {};
        
        if (data) {
          Object.values(data).forEach(row => {
            const dataStr = row.ora.substring(0, 10);
            const oraStr = row.ora.substring(11, 16); 
            if (!storeGiorni[dataStr]) {
              storeGiorni[dataStr] = { letture: [], sumAcqua: 0, sumAria: 0, sumHum: 0, count: 0 };
            }
            storeGiorni[dataStr].letture.push({ ora: oraStr, acqua: row.t_acqua, aria: row.t_aria });
            storeGiorni[dataStr].sumAcqua += parseFloat(row.t_acqua);
            storeGiorni[dataStr].sumAria += parseFloat(row.t_aria);
            storeGiorni[dataStr].sumHum += parseFloat(row.u_aria);
            storeGiorni[dataStr].count++;
          });
        }
        renderCalendarStrip();
      });
    }

    function renderCalendarStrip() {
      const strip = document.getElementById('calendar-strip');
      strip.innerHTML = "";
      const dateOrdinate = Object.keys(storeGiorni).sort().reverse();
      
      if (dateOrdinate.length === 0) {
        document.getElementById('day-view').style.display = 'none';
        strip.innerHTML = '<div class="no-data">Nessun dato in questo mese. 📭</div>';
        return;
      }

      dateOrdinate.forEach(dataStr => {
        const d = new Date(dataStr);
        const label = d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
        
        const pill = document.createElement('div');
        pill.className = 'day-pill';
        pill.innerText = label;
        pill.onclick = () => loadDayView(dataStr, pill);
        strip.appendChild(pill);
      });

      if (!activeDateStr || !storeGiorni[activeDateStr]) {
        loadDayView(dateOrdinate[0], strip.firstChild);
      } else {
        const activeIdx = dateOrdinate.indexOf(activeDateStr);
        loadDayView(activeDateStr, strip.children[activeIdx]);
      }
    }

    function loadDayView(dataStr, pillElement) {
      activeDateStr = dataStr;
      
      document.querySelectorAll('.day-pill').forEach(el => el.classList.remove('active'));
      pillElement.classList.add('active');

      const g = storeGiorni[dataStr];
      document.getElementById('day-view').style.display = 'block';
      
      const d = new Date(dataStr);
      document.getElementById('day-title').innerText = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });

      document.getElementById('avg-acqua').innerText = (g.sumAcqua / g.count).toFixed(1) + "°";
      document.getElementById('avg-aria').innerText = (g.sumAria / g.count).toFixed(1) + "°";
      document.getElementById('avg-umidita').innerText = (g.sumHum / g.count).toFixed(0) + "%";

      const ctx = document.getElementById('main-chart').getContext('2d');
      if (mainChart) mainChart.destroy();
      
      mainChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: g.letture.map(l => l.ora),
          datasets: [
            { label: 'Acqua', borderColor: '#0A84FF', data: g.letture.map(l => l.acqua), pointRadius: 0, tension: 0.4, borderWidth: 3 },
            { label: 'Aria', borderColor: '#FF9F0A', data: g.letture.map(l => l.aria), pointRadius: 0, tension: 0.4, borderWidth: 3 }
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          plugins: { 
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: function(context) { return 'Ore ' + context[0].label; },
                label: function(context) { return context.dataset.label + ': ' + context.parsed.y + '°C'; }
              }
            }
          },
          scales: { 
            x: { display: true, grid: { display: false }, ticks: { color: '#8E8E93', maxTicksLimit: 8 } }, 
            y: { display: true, grid: { color: '#38383A' }, ticks: { color: '#8E8E93' } } 
          }
        }
      });
    }

    // --- AZIONI MANUALI ---
    window.registraAzione = function(tipoAzione) {
      if (!activeDateStr) return;
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      const oraEsatta = now.toISOString().substring(11, 16);
      
      push(ref(db, 'registri_manuali'), {
        data_ora: activeDateStr + " " + oraEsatta,
        azione: tipoAzione
      }).then(() => {
        alert(tipoAzione + " registrato il " + activeDateStr + " alle " + oraEsatta);
      });
    }
    
    document.getElementById('btn-nutrienti').onclick = () => registraAzione('Nutrienti');
    document.getElementById('btn-acido').onclick = () => registraAzione('Acido');

    initFiltri();
  </script>
</body>
</html>
